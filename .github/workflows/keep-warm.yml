name: Keep backend warm

# The backend runs on Render's free tier, which suspends the instance after
# ~15 minutes with no inbound traffic. The next visitor then eats a 30-60s
# cold start that Render serves as a raw, CORS-header-less 502/503 -- which
# the browser reports as a CORS error. Pinging any route resets the idle
# timer, so this hits /health on a schedule to keep the instance up.
#
# NOT the primary mechanism -- a dedicated external uptime monitor is (set
# up outside this repo, see docs/PROGRESS.md). GitHub's scheduled runs
# turned out to be far more than "several minutes late": measured runs
# landing 1h44m to 4h43m apart against a "*/10" schedule, over a 26-hour
# window with only 7 actual firings. Kept as a free, zero-effort secondary
# ping -- it does still fire, just not reliably enough to depend on alone.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
              https://melody-generator-ai.onrender.com/health || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "::warning::/health did not return 200 after 3 attempts (last: $code)"
          exit 1
