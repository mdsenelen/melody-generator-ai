name: Keep backend warm

# The backend runs on Render's free tier, which suspends the instance after
# ~15 minutes with no inbound traffic. The next visitor then eats a 30-60s
# cold start that Render serves as a raw, CORS-header-less 502/503 -- which
# the browser reports as a CORS error. Pinging any route resets the idle
# timer, so this hits /health on a schedule to keep the instance up.
#
# GitHub's scheduled runs are best-effort and often land several minutes
# late, so the interval is set well under the 15-minute suspend window. If
# cold starts still show up in Render metrics, drop to "*/5" or move this to
# a dedicated uptime monitor (e.g. UptimeRobot / cron-job.org), which also
# gives you alerting.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
              https://melody-generator-ai.onrender.com/health || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "::warning::/health did not return 200 after 3 attempts (last: $code)"
          exit 1
